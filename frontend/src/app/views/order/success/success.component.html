<section
  class="thank-you"
  role="dialog"
  aria-modal="true"
  aria-labelledby="thank-you-title"
>
  <a class="thank-you__close" routerLink="/" aria-label="Закрыть">×</a>
  <div class="thank-you__content">
    <h1 class="thank-you__title" id="thank-you-title">Благодарим за заказ!</h1>
    <div class="thank-you__details">
      <p class="thank-you__text">Ваш заказ оформлен.</p>
      <p class="thank-you__text">Вся информация о заказе была выслана вам на почту.</p>
      <p class="thank-you__text">Курьер свяжется с вами за два часа до доставки товара.</p>
    </div>
    <div class="thank-you__image-wrap">
      <img
        class="thank-you__image"
        src="assets/images/hero-succulent.png"
        width="420"
        height="320"
        alt=""
        aria-hidden="true"
      >
    </div>
  </div>
</section>
